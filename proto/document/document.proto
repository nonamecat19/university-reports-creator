syntax = "proto3";

package document;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/nnc/university-reports-creator/gen/go/document";

// Document CRUD + editing surface (FR-API-07). Snapshot/source/review RPCs are
// added in their phases (P2+); revisions are per-section plus a separate
// metadata revision (FR-EDT-09, FR-DAT-02).
service DocumentService {
  rpc CreateDocument(CreateDocumentRequest) returns (DocumentResponse);
  rpc GetDocument(GetDocumentRequest) returns (DocumentResponse);
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);
  rpc RenameDocument(RenameDocumentRequest) returns (DocumentResponse);
  rpc UpdateMetadata(UpdateMetadataRequest) returns (DocumentResponse);
  rpc UpdateSettings(UpdateSettingsRequest) returns (DocumentResponse);
  rpc UpdateSection(UpdateSectionRequest) returns (SectionResponse);
  rpc AddSection(AddSectionRequest) returns (SectionResponse);
  rpc RemoveSection(RemoveSectionRequest) returns (RemoveSectionResponse);
  rpc ReorderSections(ReorderSectionsRequest) returns (ReorderSectionsResponse);
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);

  // Export (FR-API-11a): service-document owns the data and orchestrates
  // service-render via the sanctioned FR-ARC-07 edge.
  rpc ExportDocument(ExportDocumentRequest) returns (ExportDocumentResponse);
  rpc GetExportJob(GetExportJobRequest) returns (ExportJobStatus);
  rpc ListExports(ListExportsRequest) returns (ListExportsResponse);
  rpc PreviewPdf(PreviewPdfRequest) returns (ExportDocumentResponse);

  // Sources & bibliography (FR-API-09, FR-BIB-01..11).
  rpc AddSource(AddSourceRequest) returns (SourceResponse);
  rpc UpdateSource(UpdateSourceRequest) returns (SourceResponse);
  rpc DeleteSource(DeleteSourceRequest) returns (DeleteSourceResponse);
  rpc ListSources(ListSourcesRequest) returns (ListSourcesResponse);
  // ResolveSource turns a DOI/ISBN/URL/freeform string into a draft
  // CSL-JSON the user confirms in the form — never saved blind (FR-BIB-04).
  rpc ResolveSource(ResolveSourceRequest) returns (ResolveSourceResponse);
  // GetBibliography renders the document's reference list for editor preview
  // (FR-BIB-10) using the same citeproc pass the export uses.
  rpc GetBibliography(GetBibliographyRequest) returns (GetBibliographyResponse);

  // Version snapshots (FR-API-08, FR-EDT-10).
  rpc CreateSnapshot(CreateSnapshotRequest) returns (SnapshotResponse);
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);
  rpc RestoreSnapshot(RestoreSnapshotRequest) returns (DocumentResponse);

  // Sharing (FR-API-10, FR-REV-01..04).
  rpc ShareByEmail(ShareByEmailRequest) returns (ShareResponse);
  rpc CreateShareLink(CreateShareLinkRequest) returns (ShareResponse);
  rpc RevokeShare(RevokeShareRequest) returns (RevokeShareResponse);
  rpc ListShares(ListSharesRequest) returns (ListSharesResponse);
  rpc AcceptShareLink(AcceptShareLinkRequest) returns (AcceptShareLinkResponse);

  // Comments (FR-REV-05..08).
  rpc CreateComment(CreateCommentRequest) returns (CommentResponse);
  rpc ReplyComment(ReplyCommentRequest) returns (CommentResponse);
  rpc ResolveComment(ResolveCommentRequest) returns (CommentResponse);
  rpc DeleteComment(DeleteCommentRequest) returns (DeleteCommentResponse);
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);

  // Suggestions ride inside section content as marks; these RPCs maintain the
  // per-document registry used for listing and accept/reject (FR-REV-09..11).
  rpc ListSuggestions(ListSuggestionsRequest) returns (ListSuggestionsResponse);
  rpc RegisterSuggestions(RegisterSuggestionsRequest) returns (RegisterSuggestionsResponse);
  rpc ResolveSuggestion(ResolveSuggestionRequest) returns (ResolveSuggestionResponse);
  rpc BulkResolveSuggestions(BulkResolveSuggestionsRequest) returns (BulkResolveSuggestionsResponse);

  // Read cursors / badge counts (FR-REV-14).
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse);
  rpc GetUnreadCounts(GetUnreadCountsRequest) returns (UnreadCounts);
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_OWNER = 1;
  ROLE_EDITOR = 2;
  ROLE_COMMENTER = 3;
  ROLE_VIEWER = 4;
}

enum SectionKind {
  SECTION_KIND_UNSPECIFIED = 0;
  SECTION_KIND_CHAPTER = 1;
  SECTION_KIND_APPENDIX = 2;
}

message Settings {
  string citation_style = 1;
  // by_order | alphabetical (FR-BIB-06)
  string numbering_mode = 2;
  bool include_uncited = 3;
  // repeat_header | continuation_caption (FR-TBL-08/09)
  string table_continuation = 4;
}

message Section {
  string id = 1;
  // Template section this instantiates; empty for user-added extra sections.
  string template_section_id = 2;
  string title = 3;
  SectionKind kind = 4;
  int32 order = 5;
  bool required = 6;
  // Per-section optimistic concurrency (FR-EDT-09).
  int32 revision = 7;
  // ProseMirror JSON (schema per FR-EDT-04).
  string content_json = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message Document {
  string id = 1;
  string owner_id = 2;
  string template_id = 3;
  int32 template_version = 4;
  string title = 5;
  // field_name -> value (template metadata fields).
  map<string, string> metadata = 6;
  Settings settings = 7;
  // Optimistic concurrency for metadata/settings writes (FR-EDT-09).
  int32 metadata_revision = 8;
  // Caller's effective role, resolved server-side.
  Role my_role = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message CreateDocumentRequest {
  // Optional in P1 (documents can start without a template).
  string template_id = 1;
  int32 template_version = 2;
  string title = 3;
}

message GetDocumentRequest {
  string id = 1;
}

enum DocumentFilter {
  DOCUMENT_FILTER_UNSPECIFIED = 0;
  DOCUMENT_FILTER_OWN = 1;
  DOCUMENT_FILTER_SHARED = 2;
}

message ListDocumentsRequest {
  DocumentFilter filter = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListDocumentsResponse {
  repeated Document documents = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message RenameDocumentRequest {
  string id = 1;
  string title = 2;
}

message UpdateMetadataRequest {
  string id = 1;
  map<string, string> values = 2;
  int32 metadata_revision = 3;
}

message UpdateSettingsRequest {
  string id = 1;
  Settings settings = 2;
  int32 metadata_revision = 3;
}

message UpdateSectionRequest {
  string document_id = 1;
  string section_id = 2;
  string content_json = 3;
  int32 section_revision = 4;
}

message AddSectionRequest {
  string document_id = 1;
  string title = 2;
  SectionKind kind = 3;
  // Insert position; appended when omitted.
  int32 order = 4;
}

message RemoveSectionRequest {
  string document_id = 1;
  string section_id = 2;
}

message RemoveSectionResponse {}

message ReorderSectionsRequest {
  string document_id = 1;
  repeated string section_ids = 2;
}

message ReorderSectionsResponse {
  repeated Section sections = 1;
}

message DeleteDocumentRequest {
  string id = 1;
}

message DeleteDocumentResponse {}

message DocumentResponse {
  Document document = 1;
  repeated Section sections = 2;
}

message SectionResponse {
  Section section = 1;
}

// ── Export (FR-API-11a, FR-EXP-04..09) ──────────────────────────────

message ExportOptions {
  // "docx" | "docx+pdf"
  string format = 1;
  // clean | with_track_changes | all_accepted (FR-REV-13)
  string suggestions_strategy = 2;
  bool include_comments = 3;
  // repeat_header | continuation_caption (FR-TBL-08/09)
  string table_continuation = 4;
}

message ExportDocumentRequest {
  string document_id = 1;
  ExportOptions options = 2;
}

message ExportDocumentResponse {
  string job_id = 1;
}

message PreviewPdfRequest {
  string document_id = 1;
}

message ExportArtifact {
  // "docx" | "pdf"
  string kind = 1;
  // service-files object key.
  string file_key = 2;
  string filename = 3;
}

message GetExportJobRequest {
  string job_id = 1;
}

message ExportJobStatus {
  string job_id = 1;
  string document_id = 2;
  // queued | running | done | failed
  string status = 3;
  string stage = 4;
  repeated string warnings = 5;
  repeated ExportArtifact artifacts = 6;
  string error = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp finished_at = 9;
}

message ListExportsRequest {
  string document_id = 1;
}

message ListExportsResponse {
  repeated ExportJobStatus jobs = 1;
}

// ── Sources & bibliography (FR-API-09, 06-bibliography.md) ───────────

message Source {
  string id = 1;
  string document_id = 2;
  // CSL-JSON (FR-BIB-02) — style-agnostic input for the citeproc pass;
  // crosses the wire as JSON per FR-API-04.
  string csl_json = 3;
  // uk | en | other — affects ДСТУ rendering.
  string language = 4;
  // What the user pasted, kept for re-resolution/debugging.
  string raw_input = 5;
  // manual | auto | needs_review (FR-BIB-02)
  string fill_status = 6;
  // ISO date the online source was accessed.
  string access_date = 7;
  // Forces this source into the list even when uncited (FR-BIB-07).
  bool include_uncited_override = 8;
  google.protobuf.Timestamp created_at = 9;
}

message AddSourceRequest {
  string document_id = 1;
  string csl_json = 2;
  string language = 3;
  string raw_input = 4;
  string fill_status = 5;
  string access_date = 6;
}

message UpdateSourceRequest {
  string document_id = 1;
  string source_id = 2;
  string csl_json = 3;
  string language = 4;
  string fill_status = 5;
  string access_date = 6;
  bool include_uncited_override = 7;
}

message DeleteSourceRequest {
  string document_id = 1;
  string source_id = 2;
}

message DeleteSourceResponse {}

message SourceResponse {
  Source source = 1;
}

message ListSourcesRequest {
  string document_id = 1;
}

message ListSourcesResponse {
  repeated Source sources = 1;
}

message ResolveSourceRequest {
  // DOI, ISBN, URL, or a freeform reference string (FR-BIB-04).
  string input = 1;
}

message ResolveSourceResponse {
  // Draft CSL-JSON for the entry form; empty when nothing resolved.
  string csl_json = 1;
  // doi | isbn | url | freeform | none — which resolver answered.
  string resolver = 2;
  // manual | auto | needs_review
  string fill_status = 3;
  string warning = 4;
}

message GetBibliographyRequest {
  string document_id = 1;
}

message BibliographyEntry {
  int32 number = 1;
  string source_id = 2;
  string formatted = 3;
}

message GetBibliographyResponse {
  repeated BibliographyEntry entries = 1;
  // Source ids cited in section content but missing from the library
  // (FR-BIB-07) — the client flags these and export blocks on them.
  repeated string orphaned_citation_ids = 2;
}

// ── Version snapshots (FR-API-08, FR-EDT-10) ─────────────────────────

message Snapshot {
  string id = 1;
  string document_id = 2;
  string name = 3;
  // manual | export | bulk_accept | auto
  string trigger = 4;
  google.protobuf.Timestamp created_at = 5;
}

message CreateSnapshotRequest {
  string document_id = 1;
  string name = 2;
}

message SnapshotResponse {
  Snapshot snapshot = 1;
}

message ListSnapshotsRequest {
  string document_id = 1;
}

message ListSnapshotsResponse {
  repeated Snapshot snapshots = 1;
}

message RestoreSnapshotRequest {
  string document_id = 1;
  string snapshot_id = 2;
}

// ── Review mode: shares, comments, suggestions (FR-API-10, 07) ───────

message Share {
  string id = 1;
  string document_id = 2;
  // email | link
  string kind = 3;
  Role role = 4;
  // Bound on accept; empty for a link share nobody has opened yet.
  string user_id = 5;
  string email = 6;
  // Raw token, returned only in the CreateShareLink response — the record
  // keeps a hash (FR-DAT-03).
  string link_token = 7;
  bool revoked = 8;
  google.protobuf.Timestamp created_at = 9;
}

message ShareByEmailRequest {
  string document_id = 1;
  string email = 2;
  Role role = 3;
}

message CreateShareLinkRequest {
  string document_id = 1;
  Role role = 2;
}

message ShareResponse {
  Share share = 1;
}

message RevokeShareRequest {
  string document_id = 1;
  string share_id = 2;
}

message RevokeShareResponse {}

message ListSharesRequest {
  string document_id = 1;
}

message ListSharesResponse {
  repeated Share shares = 1;
}

message AcceptShareLinkRequest {
  string token = 1;
}

message AcceptShareLinkResponse {
  string document_id = 1;
  Role role = 2;
}

message CommentAnchor {
  // Stable block UUID from the ProseMirror schema (FR-EDT-04/FR-REV-05).
  string block_id = 1;
  int32 offset_from = 2;
  int32 offset_to = 3;
  // Anchored text, used to repair offsets after offline edits (FR-REV-06).
  string text_snapshot = 4;
}

message Comment {
  string id = 1;
  string document_id = 2;
  string section_id = 3;
  // Empty for a thread root; set to the root's id for replies.
  string thread_root_id = 4;
  // User id, or the literal "ai" for analysis findings (FR-AI-09).
  string author = 5;
  string ai_category = 6;
  CommentAnchor anchor = 7;
  // The anchored block no longer exists; the comment lists at section level
  // rather than being dropped (FR-REV-06).
  bool orphaned = 8;
  string body = 9;
  string resolved_by = 10;
  google.protobuf.Timestamp resolved_at = 11;
  google.protobuf.Timestamp created_at = 12;
}

message CreateCommentRequest {
  string document_id = 1;
  string section_id = 2;
  CommentAnchor anchor = 3;
  string body = 4;
  // Set by AI analysis runs (FR-AI-09); ignored for user comments.
  string ai_category = 5;
}

message ReplyCommentRequest {
  string document_id = 1;
  string thread_root_id = 2;
  string body = 3;
}

message ResolveCommentRequest {
  string document_id = 1;
  string comment_id = 2;
  // false reopens a resolved thread (FR-REV-07).
  bool resolved = 3;
}

message DeleteCommentRequest {
  string document_id = 1;
  string comment_id = 2;
}

message DeleteCommentResponse {}

enum CommentFilter {
  COMMENT_FILTER_UNSPECIFIED = 0;
  COMMENT_FILTER_ALL = 1;
  COMMENT_FILTER_OPEN = 2;
  COMMENT_FILTER_RESOLVED = 3;
  COMMENT_FILTER_MINE = 4;
  COMMENT_FILTER_AI = 5;
}

message ListCommentsRequest {
  string document_id = 1;
  CommentFilter filter = 2;
}

message ListCommentsResponse {
  repeated Comment comments = 1;
}

message CommentResponse {
  Comment comment = 1;
}

message Suggestion {
  string id = 1;
  string document_id = 2;
  string section_id = 3;
  // Matches the suggestion id carried by the marks in section content.
  string suggestion_id = 4;
  string author_id = 5;
  // insert | delete | format
  string kind = 6;
  // pending | accepted | rejected
  string status = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp resolved_at = 9;
}

message ListSuggestionsRequest {
  string document_id = 1;
}

message ListSuggestionsResponse {
  repeated Suggestion suggestions = 1;
}

message RegisterSuggestionsRequest {
  string document_id = 1;
  string section_id = 2;
  // Suggestion ids present in the section's content after a suggest-mode
  // write; the registry is reconciled against them (FR-REV-11).
  repeated string suggestion_ids = 3;
  string kind = 4;
}

message RegisterSuggestionsResponse {
  repeated Suggestion suggestions = 1;
}

message ResolveSuggestionRequest {
  string document_id = 1;
  string suggestion_id = 2;
  // true accepts (apply + strip marks), false rejects (revert).
  bool accept = 3;
  // Content of the affected section after the client applied the resolution,
  // with its revision (FR-EDT-09).
  string content_json = 4;
  string section_id = 5;
  int32 section_revision = 6;
}

message ResolveSuggestionResponse {
  Suggestion suggestion = 1;
  Section section = 2;
}

message BulkResolveSuggestionsRequest {
  string document_id = 1;
  string section_id = 2;
  bool accept = 3;
  string content_json = 4;
  int32 section_revision = 5;
}

message BulkResolveSuggestionsResponse {
  repeated Suggestion suggestions = 1;
  Section section = 2;
}

message MarkReadRequest {
  string document_id = 1;
}

message MarkReadResponse {}

message UnreadCounts {
  string document_id = 1;
  int32 comments = 2;
  int32 suggestions = 3;
}

message GetUnreadCountsRequest {
  string document_id = 1;
}
