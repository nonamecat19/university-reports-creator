syntax = "proto3";

package auth;

option go_package = "github.com/nnc/university-reports-creator/gen/go/auth";

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc LoginWithGoogle(LoginWithGoogleRequest) returns (LoginWithGoogleResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  // Revokes the given refresh token (FR-AUTH-06).
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // Profile of the authenticated user (user id comes from gateway metadata).
  rpc GetProfile(GetProfileRequest) returns (ProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (ProfileResponse);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string name = 3;
}

message RegisterResponse {
  string user_id = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message LoginWithGoogleRequest {
  string id_token = 1;
}

message LoginWithGoogleResponse {
  string access_token = 1;
  string refresh_token = 2;
  string user_id = 3;
  string email = 4;
  string name = 5;
}

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  string user_id = 1;
  string email = 2;
  bool valid = 3;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message GetProfileRequest {}

// Report-prefill defaults used to prefill template metadata fields (FR-AUTH-08).
message Profile {
  string user_id = 1;
  string email = 2;
  string name = 3;
  string university = 4;
  string faculty = 5;
  string department = 6;
  string student_group = 7;
  string supervisor = 8;
}

message UpdateProfileRequest {
  string name = 1;
  string university = 2;
  string faculty = 3;
  string department = 4;
  string student_group = 5;
  string supervisor = 6;
}

message ProfileResponse {
  Profile profile = 1;
}
