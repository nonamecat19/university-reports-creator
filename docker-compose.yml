services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auth}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  surrealdb:
    image: surrealdb/surrealdb:latest
    pull_policy: always
    user: root
    restart: unless-stopped
    command: start --user root --pass root surrealkv:/data
    volumes:
      - surrealdb_data:/data
    ports:
      - "8000:8000"

  surrealdb-health:
    image: alpine:latest
    restart: "no"
    command: ["sleep", "infinity"]
    depends_on:
      surrealdb:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://surrealdb:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  service-ai:
    build:
      context: .
      dockerfile: service-ai/Dockerfile
    restart: unless-stopped
    ports:
      - "50055:50055"
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_MODEL: ${AI_MODEL:-gemma3:8b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LANGUAGETOOL_ENABLED: "false"
      LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  service-render:
    build:
      context: .
      dockerfile: service-render/Dockerfile
    restart: unless-stopped
    ports:
      - "50054:50054"
    environment:
      LOG_LEVEL: ${RENDER_LOG_LEVEL:-INFO}

volumes:
  pgdata:
  surrealdb_data:
  minio_data:
