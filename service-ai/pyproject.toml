[project]
name = "service-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.82.1",
    "grpcio-tools>=1.82.1",
    "httpx>=0.28.1",
    "language-tool-python>=3.4.0",
    "protobuf>=7.35.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "shared-py",
]

[tool.uv.sources]
shared-py = { path = "../pkg/shared-py", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai"]
