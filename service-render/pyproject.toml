[project]
name = "service-render"
version = "0.1.0"
description = "docx template parsing, docx export merge, PDF conversion, CSL bibliography rendering"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.82.1",
    "grpcio-tools>=1.82.1",
    "protobuf>=7.35.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-docx>=1.2.0",
    "defusedxml>=0.7.1",
    "httpx>=0.28.1",
    "shared-py",
]

[tool.uv.sources]
shared-py = { path = "../pkg/shared-py", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/render"]
