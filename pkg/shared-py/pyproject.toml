[project]
name = "shared-py"
version = "0.1.0"
description = "Shared Python utilities for university-reports-creator gRPC services"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.62.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
