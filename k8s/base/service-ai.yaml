apiVersion: v1
kind: Service
metadata:
  name: service-ai
  namespace: university-reports
  labels:
    app: service-ai
spec:
  ports:
    - port: 50055
      targetPort: 50055
      protocol: TCP
  selector:
    app: service-ai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-ai
  namespace: university-reports
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-ai
  template:
    metadata:
      labels:
        app: service-ai
    spec:
      containers:
        - name: service-ai
          image: university-reports-creator/service-ai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50055
          env:
            - name: PORT
              value: "50055"
            - name: AI_PROVIDER
              value: "ollama"
            - name: AI_MODEL
              value: "gemma3:8b"
            - name: OLLAMA_BASE_URL
              value: "http://ollama:11434"
            - name: LANGUAGETOOL_ENABLED
              value: "false"
            - name: LOG_LEVEL
              value: "INFO"
          livenessProbe:
            exec:
              command: ["python", "-c", "import grpc; c=grpc.insecure_channel('localhost:50055'); grpc.channel_ready_future(c).result(timeout=5)"]
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            exec:
              command: ["python", "-c", "import grpc; c=grpc.insecure_channel('localhost:50055'); grpc.channel_ready_future(c).result(timeout=5)"]
            initialDelaySeconds: 5
            periodSeconds: 10
